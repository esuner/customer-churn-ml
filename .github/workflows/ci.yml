name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pytest
        run: python -m pytest

  image:
    name: Imagen Docker
    # Solo corre si los tests pasaron: si fallan, el pipeline se corta acá y no se publica nada
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Calcular tags y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Construir imagen para la prueba de humo
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: churn-api:ci
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name churn-api -p 8000:8000 churn-api:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health > /dev/null && break
            sleep 2
          done
          curl -fs http://localhost:8000/health | tee health.json
          grep -q '"status":"ok"' health.json
          grep -q "\"git_commit\":\"${{ github.sha }}\"" health.json
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @data/examples/predict_request_valid.json | tee prediction.json
          grep -q '"prediction"' prediction.json
          grep -q '"request_id"' prediction.json

      - name: Logs del contenedor (si algo falló)
        if: failure()
        run: docker logs churn-api

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha

  release:
    name: Release en GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" $PRERELEASE \
            --notes "Imagen: ${IMAGE_NAME}:${TAG#v}
          Commit: ${GITHUB_SHA}
          Modelo registrado: churn-classifier (alias candidate, ver models/churn-classifier/model_info.json)"
